name: Verify catalogue promotion
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Exact run ID holding the signed-catalogue candidate
        required: true
      artifact_name:
        description: Exact signed catalogue artifact name
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-catalogue.txt
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name }}
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
          path: candidate
      - run: python scripts/catalogue.py verify-promotion --repository candidate/repository --evidence candidate/acceptance.json
      - run: echo 'Verification succeeded. Publication remains a separate reviewed operation.'
