name: Go tool arm64 build candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        tool: [ffuf, nuclei, trivy, osv-scanner]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5
        with:
          go-version: '1.27.2'
          cache: false
      - run: python scripts/validate.py
      - name: Build source candidate
        env:
          WIXAL_CANDIDATE_TOOL: ${{ matrix.tool }}
        run: python scripts/build-go-tool.py --tool "$WIXAL_CANDIDATE_TOOL" --output "artifacts/$WIXAL_CANDIDATE_TOOL"
      - name: Archive candidate
        env:
          WIXAL_CANDIDATE_TOOL: ${{ matrix.tool }}
        run: tar -czf "artifacts/$WIXAL_CANDIDATE_TOOL-darwin-arm64.tar.gz" -C "artifacts/$WIXAL_CANDIDATE_TOOL" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.tool }}-darwin-arm64-${{ github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          retention-days: 14
